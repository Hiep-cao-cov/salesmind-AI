<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Competency Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap + FontAwesome + Chart.js + PapaParse -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://kit.fontawesome.com/a2d9d6ef5c.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f5f7fa; }

    /* Sidebar */
    .sidebar { height: 100vh; background: linear-gradient(180deg,#667eea,#764ba2); color: #fff; padding: 20px; }
    .sidebar h3 { font-weight:700; margin-bottom:24px; }
    .sidebar a { display:block; padding:10px; color:#fff; text-decoration:none; margin-bottom:6px; border-radius:6px; cursor:pointer; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.3); }
    .sidebar .submenu { margin-left:15px; font-size: 0.9em; }
    .sidebar .disabled { cursor: default; opacity: 0.6; }

    /* Panels */
    .main-panel { background:#fff; padding:20px; height:100vh; overflow-y:auto; }
    .detail-panel { background:#fdfdfd; padding:20px; height:100vh; overflow-y:auto; border-left:1px solid #ddd; }

    /* Two-tone user cards */
    .user-card { cursor:pointer; margin-bottom:10px; border-radius:10px; overflow:hidden; display:flex; transition:transform .1s ease, box-shadow .2s ease; }
    .user-card:hover { transform:scale(1.01); box-shadow:0 6px 18px rgba(0,0,0,0.12); }
    /* Fancy gradient pair: Name (left) and Role (right) */
    .user-name  { flex:1; padding:12px 14px; font-weight:700; color:#fff; background:linear-gradient(135deg,#667eea,#764ba2); }
    .user-role  { flex:1; padding:12px 14px; font-weight:600; color:#fff; background:linear-gradient(135deg,#43cea2,#185a9d); }

    /* Competency buttons */
    .competency-btn { margin-bottom:10px; border:none; border-radius:10px; padding:12px 14px; font-weight:700; text-align:left; color:#fff; transition:transform .1s ease, box-shadow .2s ease; }
    .competency-btn:hover { transform:scale(1.01); box-shadow:0 6px 18px rgba(0,0,0,0.15); }

    /* Badges for ratings */
    .badge-strong { background:#28a745; }
    .badge-capability { background:#0d6efd; }
    .badge-developing { background:#ffc107; color:#000; }
    .badge-none { background:#6c757d; }

    /* Fancy table styles */
    .table-wrap { border-radius:12px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
    .table thead th { background:linear-gradient(135deg,#36d1dc,#5b86e5); color:#fff; border:none; }
    .table tbody tr:hover { background: #f7fbff; }
    .table td, .table th { vertical-align: middle; }

    /* Tiny helper */
    .muted { color:#6c757d; }
  </style>
</head>
<body onload="loadAllData()">
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-12 col-md-2 sidebar">
      <h3><i class="fas fa-user-graduate"></i> SalesMind</h3>
      <a id="navDashboard" class="disabled active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <div class="submenu">
        <a id="navAll"><i class="fas fa-users"></i> Show All Users</a>
        <a id="navSingle"><i class="fas fa-user"></i> Select User</a>
      </div>
      <a id="navCompetencies"><i class="fas fa-brain"></i> Competencies</a>
      <a id="navReports"><i class="fas fa-chart-line"></i> Reports</a>
    </div>

    <!-- Main Panel -->
    <div class="col-12 col-md-4 main-panel" id="mainPanel">
      <h4 id="mainTitle">My Assessments</h4>

      <!-- Select User dropdown -->
      <div id="userSelectBox" class="mb-3" style="display:none;">
        <label class="form-label">Select User</label>
        <select id="userSelect" class="form-select form-select-sm" onchange="renderSingleCard()"></select>
      </div>

      <!-- Dynamic content -->
      <div id="cardsContainer"></div>
    </div>

    <!-- Detail Panel (with fade) -->
    <div class="col-12 col-md-6 detail-panel">
      <div id="detailContent" class="fade show">
        <div class="mb-2">
          <h5 id="profileName" class="muted">Select a user</h5>
          <p id="profileRole" class="text-muted mb-0"></p>
        </div>
        <div id="ratingsTable" class="mt-3"></div>
        <h6 id="radarLabel" class="mt-4">Competency Radar</h6>
        <canvas id="radarChart" height="200"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
/* ======= Global State ======= */
let people=[], ratings=[], competencies=[], roles=[], details=[];
let radarChart;
let currentMode="all";
let selectedCompetency=null;

function parseCSV(path, cb){
  Papa.parse(path,{download:true,header:true,skipEmptyLines:true,complete:(res)=>cb(res.data)});
}

function loadAllData(){
  parseCSV("data/people.csv", rows=>{
    people = rows.map(r=>({person_id:r["person_id"].trim(),name:r["name"].trim(),role:r["role/job"].trim(),score:parseInt(r["overall_score"])}));
    populateUserSelect();
    renderAllUsers(); // default
  });
  parseCSV("data/ratings.csv", rows=>{
    ratings = rows.map(r=>({person_id:r["person_id"].trim(),competency:r["competency"].trim().toLowerCase(),rating:r["rating"].trim()}));
  });
  parseCSV("data/competencies.csv", rows=>{
    competencies = rows.map(r=>({competency:r["competency"].trim(),level:r["level"].trim(),item_id:r["item_id"].trim(),item_text:r["item_text"].trim()}));
  });
  parseCSV("data/role_profiles.csv", rows=>{
    roles = rows.map(r=>({role:r["role"].trim(),competency:r["competency"].trim().toLowerCase(),expected:r["expected"].trim()}));
  });
  parseCSV("data/rating_details.csv", rows=>{
    details = rows.map(r=>({person_id:r["person_id"].trim(),competency:r["competency"].trim(),rating:r["rating"].trim(),detail:r["detail"]?r["detail"].trim():""}));
  });
}

/* ======= Sidebar Active ======= */
function setActive(navId){
  document.querySelectorAll(".sidebar a").forEach(a=>{if(!a.classList.contains("disabled")) a.classList.remove("active");});
  if(navId!=="navDashboard") document.getElementById(navId).classList.add("active");
  if(navId==="navAll"||navId==="navSingle"){document.getElementById("navDashboard").classList.add("active");}
  clearDetailPanel(true);
}

/* ======= Detail Panel Fade Helpers ======= */
function fadeOutIn(callback){
  const panel=document.getElementById("detailContent");
  panel.classList.remove("show"); // fade out
  setTimeout(()=>{ callback(); panel.classList.add("show"); }, 250); // fade in
}

function clearDetailPanel(soft=false){
  // soft=true means we keep the fade but reset contents
  fadeOutIn(()=>{
    document.getElementById("profileName").innerText= soft ? "" : "Select a user";
    document.getElementById("profileRole").innerText="";
    document.getElementById("ratingsTable").innerHTML="";
    document.getElementById("radarChart").style.display="none";
    document.getElementById("radarLabel").style.display="none";
    if(radarChart) radarChart.destroy();
  });
}

/* ======= UI Builders ======= */
function populateUserSelect(){
  const select=document.getElementById("userSelect");
  select.innerHTML="";
  people.forEach((p)=>{ select.innerHTML+=`<option value="${p.person_id}">${p.name} – ${p.role}</option>`; });
}

/* ======= Navigation Handlers ======= */
document.getElementById("navAll").onclick=()=>{ setActive("navAll"); renderAllUsers(); };
document.getElementById("navSingle").onclick=()=>{ setActive("navSingle"); renderSelectUser(); };
document.getElementById("navCompetencies").onclick=()=>{ setActive("navCompetencies"); renderCompetencies(); };
document.getElementById("navReports").onclick=()=>{ setActive("navReports"); renderReports(); };

/* ======= Views ======= */
function renderAllUsers(){
  currentMode="all";
  document.getElementById("mainTitle").innerText="All Users";
  document.getElementById("userSelectBox").style.display="none";
  const container=document.getElementById("cardsContainer");
  container.innerHTML="";

  people.forEach(p=>{
    container.innerHTML+=`
      <div class="user-card" onclick="showUserSummary('${p.person_id}')">
        <div class="user-name">${p.name}</div>
        <div class="user-role">${p.role}</div>
      </div>`;
  });

  if(people.length>0) showUserSummary(people[0].person_id); // auto show first user (ratings + radar)
}

function renderSelectUser(){
  currentMode="single";
  document.getElementById("mainTitle").innerText="Select User";
  document.getElementById("userSelectBox").style.display="block";
  const container=document.getElementById("cardsContainer");
  container.innerHTML="";

  // Auto select first user and render card + details table (from rating_details.csv)
  if(people.length>0){
    document.getElementById("userSelect").value = people[0].person_id;
    renderSingleCard(); // also triggers detail panel (fancy table)
  }
}

function renderSingleCard(){
  const pid=document.getElementById("userSelect").value;
  const p=people.find(x=>x.person_id===pid);
  const container=document.getElementById("cardsContainer");
  container.innerHTML="";
  if(p){
    container.innerHTML=`
      <div class="user-card" onclick="showUserDetailsTable('${p.person_id}')">
        <div class="user-name">${p.name}</div>
        <div class="user-role">${p.role}</div>
      </div>`;
    showUserDetailsTable(p.person_id); // auto show table with details (no radar)
  }
}

function renderCompetencies(){
  currentMode="competencies";
  document.getElementById("mainTitle").innerText="Competencies";
  document.getElementById("userSelectBox").style.display="none";
  const container=document.getElementById("cardsContainer");

  // Rotate a palette of fancy gradients
  const gradients = [
    "linear-gradient(135deg,#667eea,#764ba2)",
    "linear-gradient(135deg,#ff9966,#ff5e62)",
    "linear-gradient(135deg,#36d1dc,#5b86e5)",
    "linear-gradient(135deg,#f7971e,#ffd200)",
    "linear-gradient(135deg,#00b09b,#96c93d)",
    "linear-gradient(135deg,#ec77ab,#7873f5)"
  ];

  let uniqueComps=[...new Set(competencies.map(c=>c.competency))];
  let btnHtml="";
  uniqueComps.forEach((c,i)=>{
    let style=`background:${gradients[i % gradients.length]};`;
    btnHtml+=`<button class="competency-btn d-block w-100" style="${style}" onclick="selectCompetency('${c}')">${c}</button>`;
  });

  container.innerHTML = `
    <div id="compButtons">${btnHtml}</div>
    <div class="mt-3">
      <label class="form-label">Select Level</label>
      <select id="levelSelect" class="form-select form-select-sm" onchange="refreshCompetencyDetail()">
        <option value="Developing" selected>Developing</option>
        <option value="Capability">Capability</option>
        <option value="Strong">Strong</option>
      </select>
    </div>
  `;

  // Clear detail panel and hide radar in competencies view
  fadeOutIn(()=>{
    document.getElementById("profileName").innerText="Select a competency";
    document.getElementById("profileRole").innerText="";
    document.getElementById("ratingsTable").innerHTML="";
    document.getElementById("radarChart").style.display="none";
    document.getElementById("radarLabel").style.display="none";
    if(radarChart) radarChart.destroy();
  });
}

function renderReports(){
  document.getElementById("mainTitle").innerText="Reports";
  document.getElementById("userSelectBox").style.display="none";
  document.getElementById("cardsContainer").innerHTML="<p class='text-muted'>Reports view coming soon.</p>";
  clearDetailPanel();
}

/* ======= Detail Views ======= */
/* Show summary (ratings table + radar) -> used in Show All Users */
function showUserSummary(pid){
  const person=people.find(p=>p.person_id===pid);
  const actualRatings=ratings.filter(r=>r.person_id===pid);
  const expectedRatings=roles.filter(r=>r.role===person.role);

  fadeOutIn(()=>{
    document.getElementById("profileName").innerText=person.name;
    document.getElementById("profileRole").innerText=person.role;

    // Build ratings table (Actual vs Expected)
    let ratingsHtml = `<div class="table-wrap"><table class="table table-sm table-striped mb-0">
      <thead><tr><th>Competency</th><th>Actual</th><th>Expected</th></tr></thead><tbody>`;
    const mapping={"Developing":1,"Capability":2,"Strong":3};
    let labels=[...new Set([...actualRatings.map(r=>r.competency), ...expectedRatings.map(r=>r.competency)])];
    labels.forEach(label=>{
      let actual = actualRatings.find(r=>r.competency===label.toLowerCase())?.rating || "None";
      let expected = expectedRatings.find(r=>r.competency===label.toLowerCase())?.expected || "None";
      ratingsHtml+=`
        <tr>
          <td>${label}</td>
          <td><span class="badge ${badgeClass(actual)}">${actual}</span></td>
          <td><span class="badge ${badgeClass(expected)}">${expected}</span></td>
        </tr>`;
    });
    ratingsHtml+="</tbody></table></div>";
    document.getElementById("ratingsTable").innerHTML=ratingsHtml;

    // Show radar
    document.getElementById("radarChart").style.display="block";
    document.getElementById("radarLabel").style.display="block";

    let actualVals=labels.map(label=>{
      let r=actualRatings.find(ar=>ar.competency===label.toLowerCase());
      return r?mapping[r.rating]:0;
    });
    let expectedVals=labels.map(label=>{
      let e=expectedRatings.find(er=>er.competency===label.toLowerCase());
      return e?mapping[e.expected]:0;
    });

    if(radarChart) radarChart.destroy();
    radarChart=new Chart(document.getElementById("radarChart"),{
      type:"radar",
      data:{labels:labels,datasets:[
        {label:"Actual",data:actualVals,fill:true,backgroundColor:"rgba(102,126,234,0.2)",borderColor:"#667eea"},
        {label:"Expected",data:expectedVals,fill:true,backgroundColor:"rgba(244,67,54,0.2)",borderColor:"#f44336"}
      ]},
      options:{scales:{r:{suggestedMin:0,suggestedMax:3,ticks:{stepSize:1,callback:(v)=>['','Dev','Cap','Strong'][v]}}}}
    });
  });
}

/* Show detail table from rating_details.csv -> used in Select User mode */
function showUserDetailsTable(pid){
  const person=people.find(p=>p.person_id===pid);
  const userDetails = details.filter(d=>d.person_id===pid);

  fadeOutIn(()=>{
    document.getElementById("profileName").innerText=person ? person.name : "User";
    document.getElementById("profileRole").innerText=person ? person.role : "";

    // Build fancy 3-column table: Competency | Rating | Detail
    if(userDetails.length){
      let html = `<div class="table-wrap"><table class="table table-sm table-hover mb-0">
        <thead><tr>
          <th>Competency</th>
          <th>Rating</th>
          <th>Detail</th>
        </tr></thead><tbody>`;

        userDetails.forEach(row=>{
          html += `<tr>
            <td>${row.competency}</td>
            <td><span class="badge ${badgeClass(row.rating)}">${row.rating}</span></td>
            <td>${row.detail || "<span class='text-muted'>—</span>"}</td>
          </tr>`;
        });

      html += `</tbody></table></div>`;
      document.getElementById("ratingsTable").innerHTML = html;
    } else {
      document.getElementById("ratingsTable").innerHTML = `<div class="text-muted">No details found for this user.</div>`;
    }

    // Hide radar in Select User detail view (as requested)
    document.getElementById("radarChart").style.display="none";
    document.getElementById("radarLabel").style.display="none";
    if(radarChart) radarChart.destroy();
  });
}

/* ======= Competency detail ======= */
function selectCompetency(c){ selectedCompetency=c; refreshCompetencyDetail(); }
function refreshCompetencyDetail(){
  if(!selectedCompetency) return;
  const level=document.getElementById("levelSelect").value;
  const items=competencies.filter(x=>x.competency===selectedCompetency && x.level===level);

  fadeOutIn(()=>{
    document.getElementById("profileName").innerText="Competency Detail";
    document.getElementById("profileRole").innerText=`${selectedCompetency} – ${level}`;

    if(items.length>0){
      let html="<ul class='list-group mt-3'>";
      items.forEach(it=>{ html += `<li class="list-group-item">${it.item_text}</li>`; });
      html+="</ul>";
      document.getElementById("ratingsTable").innerHTML=html;
    } else {
      document.getElementById("ratingsTable").innerHTML=`<p class="text-muted">No items found for this selection.</p>`;
    }

    document.getElementById("radarChart").style.display="none";
    document.getElementById("radarLabel").style.display="none";
    if(radarChart) radarChart.destroy();
  });
}

/* ======= Helpers ======= */
function badgeClass(r){
  const val = String(r).toLowerCase();
  if(val==="strong") return "badge-strong";
  if(val==="capability") return "badge-capability";
  if(val==="developing") return "badge-developing";
  return "badge-none";
}
</script>
</body>
</html>
